<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
</helmet>
<nav aria-label="Điều hướng chính" style="background:#FFFFFF;border-top:1px solid #E4E0DA;box-shadow:0 -4px 16px rgba(31,42,42,.06);padding:4px 8px 30px;display:grid;grid-template-columns:1fr 1fr 1fr;font-family:'Be Vietnam Pro',sans-serif;position:relative">
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <div aria-current="page" style="min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#2F6F5E">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span style="font:600 14px/20px 'Be Vietnam Pro'">Nhà</span>
    </div>
  </sc-if>
  <sc-if value="{{ notHome }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#55615F">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span style="font:500 14px/20px 'Be Vietnam Pro'">Nhà</span>
    </div>
  </sc-if>
  <div style="min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;color:#1F2A2A">
    <div style="width:52px;height:40px;border-radius:12px;background:#2F6F5E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(31,42,42,.12)">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
    </div>
    <sc-if value="{{ isAdd }}" hint-placeholder-val="{{ false }}"><span style="font:600 14px/20px 'Be Vietnam Pro';color:#2F6F5E">Thêm</span></sc-if>
    <sc-if value="{{ notAdd }}" hint-placeholder-val="{{ true }}"><span style="font:500 14px/20px 'Be Vietnam Pro';color:#1F2A2A">Thêm</span></sc-if>
  </div>
  <div style="min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative">
    <div style="position:relative;display:flex">
      <sc-if value="{{ isReview }}" hint-placeholder-val="{{ false }}">
        <svg style="color:#2F6F5E" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      </sc-if>
      <sc-if value="{{ notReview }}" hint-placeholder-val="{{ true }}">
        <svg style="color:#55615F" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      </sc-if>
      <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}">
        <span aria-label="{{ badgeLabel }}" style="position:absolute;top:-8px;left:16px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#2F6F5E;color:#FFFFFF;border:2px solid #FFFFFF;font:600 14px/18px 'Be Vietnam Pro';font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;box-sizing:border-box">{{ badge }}</span>
      </sc-if>
    </div>
    <sc-if value="{{ isReview }}" hint-placeholder-val="{{ false }}"><span style="font:600 14px/20px 'Be Vietnam Pro';color:#2F6F5E">Chờ duyệt</span></sc-if>
    <sc-if value="{{ notReview }}" hint-placeholder-val="{{ true }}"><span style="font:500 14px/20px 'Be Vietnam Pro';color:#55615F">Chờ duyệt</span></sc-if>
  </div>
  <div aria-hidden="true" style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1F2A2A"></div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;add&quot;,&quot;review&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'add'|'review'&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const b = this.props.badge ?? 3;
    return {
      isHome: a === 'home', notHome: a !== 'home',
      isAdd: a === 'add', notAdd: a !== 'add',
      isReview: a === 'review', notReview: a !== 'review',
      hasBadge: Number(b) > 0, badge: b, badgeLabel: b + ' giấy tờ chờ duyệt'
    };
  }
}
</script>
</body>
</html>

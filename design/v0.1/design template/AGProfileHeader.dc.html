<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
</helmet>
<header style="background:#FAF8F5;font-family:'Be Vietnam Pro',sans-serif;color:#1F2A2A;border-bottom:1px solid #E4E0DA">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px">
    <div style="min-height:44px;display:flex;align-items:center;gap:2px;padding:0 8px;color:#2F6F5E;font:500 15px/22px 'Be Vietnam Pro'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span>Nhà</span>
    </div>
    <div style="min-height:44px;display:flex;align-items:center;gap:6px;padding:0 12px;color:#2F6F5E;font:500 15px/22px 'Be Vietnam Pro'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"></path><rect x="6" y="14" width="12" height="8" rx="1"></rect></svg>
      <span>Tóm tắt đi khám</span>
    </div>
  </div>
  <div style="padding:4px 16px 8px;display:flex;align-items:baseline;gap:12px">
    <h1 style="margin:0;font:600 24px/32px 'Be Vietnam Pro'">{{ name }}</h1>
    <span style="font:500 15px/22px 'Be Vietnam Pro';color:#55615F">{{ meta }}</span>
  </div>
  <div role="tablist" style="display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:0 8px">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}">
        <div role="tab" aria-selected="true" style="flex:none;white-space:nowrap;min-height:44px;padding:0 10px;display:flex;align-items:center;font:600 15px/22px 'Be Vietnam Pro';color:#1F2A2A;box-shadow:inset 0 -2px 0 #2F6F5E">{{ t.label }}</div>
      </sc-if>
      <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}">
        <div role="tab" style="flex:none;white-space:nowrap;min-height:44px;padding:0 10px;display:flex;align-items:center;font:500 15px/22px 'Be Vietnam Pro';color:#55615F">{{ t.label }}</div>
      </sc-if>
    </sc-for>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:150},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ba&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;75 tuổi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dien-bien&quot;,&quot;thuoc&quot;,&quot;xet-nghiem&quot;,&quot;giay-to&quot;],&quot;default&quot;:&quot;dien-bien&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'dien-bien';
    const tabs = [['dien-bien','Diễn biến'],['thuoc','Thuốc'],['xet-nghiem','Xét nghiệm'],['giay-to','Giấy tờ']]
      .map(([k,l]) => ({ label: l, on: k === tab, off: k !== tab }));
    return { name: this.props.person ?? this.props.name ?? 'Ba', meta: this.props.meta ?? '75 tuổi', tabs };
  }
}
</script>
</body>
</html>

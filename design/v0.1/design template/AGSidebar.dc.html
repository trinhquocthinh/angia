<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
</helmet>
<nav aria-label="Điều hướng chính" style="width:240px;height:100%;box-sizing:border-box;background:#FFFFFF;border-right:1px solid #E4E0DA;padding:24px 12px 16px;display:flex;flex-direction:column;gap:4px;font-family:'Be Vietnam Pro',sans-serif;color:#1F2A2A">
  <div style="padding:0 12px 20px;display:flex;flex-direction:column;gap:4px">
    <span style="font:600 20px/28px 'Be Vietnam Pro';letter-spacing:.06em;color:#2F6F5E">AN GIA</span>
    <span style="font:400 14px/20px 'Be Vietnam Pro';color:#55615F;text-wrap:pretty">Chăm chút từng thói quen, chở che từng thế hệ.</span>
  </div>
  <sc-for list="{{ main }}" as="it" hint-placeholder-count="3">
    <sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}">
      <div aria-current="page" style="min-height:44px;padding:0 12px;border-radius:8px;background:#E3EFEA;display:flex;align-items:center;gap:12px;font:600 15px/22px 'Be Vietnam Pro';color:#1F2A2A;cursor:pointer"><span style="display:flex;color:#2F6F5E">{{ it.icon }}</span><span style="flex:1">{{ it.label }}</span><sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span aria-label="{{ it.badgeLabel }}" style="min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:12px;background:#2F6F5E;color:#FFFFFF;font:600 14px/24px 'Be Vietnam Pro';text-align:center;font-variant-numeric:tabular-nums">{{ it.badge }}</span></sc-if></div>
    </sc-if>
    <sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}">
      <div style="min-height:44px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:12px;font:500 15px/22px 'Be Vietnam Pro';color:#1F2A2A;cursor:pointer" style-hover="background:#E3EFEA"><span style="display:flex;color:#55615F">{{ it.icon }}</span><span style="flex:1">{{ it.label }}</span><sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span aria-label="{{ it.badgeLabel }}" style="min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:12px;background:#2F6F5E;color:#FFFFFF;font:600 14px/24px 'Be Vietnam Pro';text-align:center;font-variant-numeric:tabular-nums">{{ it.badge }}</span></sc-if></div>
    </sc-if>
  </sc-for>
  <sc-if value="{{ hasProfiles }}" hint-placeholder-val="{{ true }}"><span style="padding:20px 12px 6px;font:500 14px/20px 'Be Vietnam Pro';color:#55615F">Hồ sơ</span></sc-if>
  <sc-for list="{{ profiles }}" as="p" hint-placeholder-count="4">
    <sc-if value="{{ p.on }}" hint-placeholder-val="{{ false }}">
      <div aria-current="page" style="min-height:44px;padding:0 12px 0 44px;border-radius:8px;background:#E3EFEA;display:flex;align-items:center;font:600 15px/22px 'Be Vietnam Pro';color:#1F2A2A;cursor:pointer">{{ p.label }}</div>
    </sc-if>
    <sc-if value="{{ p.off }}" hint-placeholder-val="{{ true }}">
      <div style="min-height:44px;padding:0 12px 0 44px;border-radius:8px;display:flex;align-items:center;font:500 15px/22px 'Be Vietnam Pro';color:#1F2A2A;cursor:pointer" style-hover="background:#E3EFEA">{{ p.label }}</div>
    </sc-if>
  </sc-for>
  <div style="margin-top:auto;border-top:1px solid #E4E0DA;padding-top:12px;display:flex;flex-direction:column;gap:4px">
    <div style="min-height:44px;padding:0 12px;display:flex;align-items:center;gap:12px">
      <span aria-hidden="true" style="width:28px;height:28px;border-radius:14px;background:#F1ECE4;color:#1F2A2A;display:flex;align-items:center;justify-content:center;font:600 14px/20px 'Be Vietnam Pro'">T</span>
      <div style="display:flex;flex-direction:column"><span style="font:600 15px/22px 'Be Vietnam Pro'">Thịnh</span><span style="font:400 14px/20px 'Be Vietnam Pro';color:#55615F">Nhà mình · main</span></div>
    </div>
    <sc-if value="{{ adminOn }}" hint-placeholder-val="{{ false }}">
      <div aria-current="page" style="min-height:44px;padding:0 12px;border-radius:8px;background:#E3EFEA;display:flex;align-items:center;gap:12px;font:600 15px/22px 'Be Vietnam Pro';cursor:pointer"><svg style="color:#2F6F5E" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>Quản trị</div>
    </sc-if>
    <sc-if value="{{ adminOff }}" hint-placeholder-val="{{ true }}">
      <div style="min-height:44px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:12px;font:500 15px/22px 'Be Vietnam Pro';cursor:pointer" style-hover="background:#E3EFEA"><svg style="color:#55615F" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>Quản trị</div>
    </sc-if>
    <div style="min-height:44px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:12px;font:500 15px/22px 'Be Vietnam Pro';cursor:pointer" style-hover="background:#E3EFEA"><svg style="color:#55615F" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>Đăng xuất</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;add&quot;,&quot;review&quot;,&quot;me&quot;,&quot;ba&quot;,&quot;ba-ngoai&quot;,&quot;be-an&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;review&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;noProfiles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'review';
    const b = Number(this.props.badge ?? 3);
    const ic = (d, on) => React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: on ? 2 : 1.75, strokeLinecap: 'round', strokeLinejoin: 'round', dangerouslySetInnerHTML: { __html: d } });
    const P = {
      home: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
      add: '<path d="M5 12h14"/><path d="M12 5v14"/>',
      review: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>'
    };
    const main = [['home','Nhà'],['add','Thêm'],['review','Chờ duyệt']].map(([k,l]) => ({
      label: l, on: a === k, off: a !== k, icon: ic(P[k], a === k),
      hasBadge: k === 'review' && b > 0, badge: b, badgeLabel: b + ' giấy tờ chờ duyệt'
    }));
    const profiles = [['me','Mẹ'],['ba','Ba'],['ba-ngoai','Bà ngoại'],['be-an','Bé An']].map(([k,l]) => ({ label: l, on: a === k, off: a !== k }));
    const has = !this.props.noProfiles;
    return { main, profiles: has ? profiles : [], hasProfiles: has, adminOn: a === 'admin', adminOff: a !== 'admin' };
  }
}
</script>
</body>
</html>

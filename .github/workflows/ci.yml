name: CI

# Repo public chỉ verify trên GitHub-hosted runner và phát tín hiệu dispatch;
# build/sign/deploy nằm ở repo private homelab-deploy (Homelab 16 §2).
on:
  pull_request:
    branches: [sit, prod]
  push:
    branches: [sit, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  lint-and-types:
    name: Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', 'eslint.config.mjs') }}-
      - name: Hợp đồng OpenAPI khớp với mã đã commit
        run: yarn check:api
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn dup
      - run: yarn knip

  unit-and-coverage:
    name: Unit & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn build:contracts
      - run: yarn test:coverage

  rls-integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn build:contracts
      - run: yarn test:int

  build-artifacts:
    name: Build & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn build
      - name: Kiểm tra Dockerfile build được (không push)
        run: |
          docker build -f apps/api/Dockerfile -t angia-api:ci . &
          api_pid=$!
          docker build -f apps/web/Dockerfile -t angia-web:ci .
          wait "$api_pid"

  dispatch-sit:
    name: Dispatch verified SIT SHA
    needs: [lint-and-types, unit-and-coverage, rls-integration, build-artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint short-lived deploy dispatcher token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMELAB_DEPLOY_APP_ID }}
          private-key: ${{ secrets.HOMELAB_DEPLOY_APP_PRIVATE_KEY }}
          owner: trinhquocthinh
          repositories: homelab-deploy

      - name: Dispatch exact verified SHA to private control plane
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA không hợp lệ"
            exit 1
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/trinhquocthinh/homelab-deploy/actions/workflows/angia-sit.yml/dispatches \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA"

          {
            echo "## Dispatch sang control-plane private"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Target: \`trinhquocthinh/homelab-deploy/.github/workflows/angia-sit.yml\`"
            echo "- Xác thực: GitHub App installation token ngắn hạn"
          } >> "$GITHUB_STEP_SUMMARY"

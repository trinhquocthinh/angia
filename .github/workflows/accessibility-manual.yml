name: Accessibility (manual)

# Chạy theo yêu cầu; không chặn CI hoặc triển khai SIT.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Ho_Chi_Minh
  CI: 'true'

jobs:
  accessibility:
    name: Accessibility theo yêu cầu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Browser và thư viện hệ thống đã có sẵn; phiên bản phải khớp package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Kiểm tra phiên bản Playwright khớp image
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          for (const name of ['@playwright/test', 'playwright-core']) {
            assert.equal(require(`${name}/package.json`).version, '1.64.1');
          }
          NODE
      - run: yarn build:contracts
      - run: yarn workspace @angia/web build
      - name: axe hai nền ở 360 px
        run: yarn playwright test --config playwright.a11y.config.ts
      - name: Lighthouse Accessibility hai nền
        run: yarn lhci autorun
      - name: Lưu báo cáo accessibility (dữ liệu giả)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: today-accessibility
          path: |
            .playwright/a11y/
            .playwright/lighthouse/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
